[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "derivlab"
version = "0.1.0"
description = "Reproducing models from Hull's Options, Futures, and Other Derivatives"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10"
]

[project.optional-dependencies]
notebook = ["jupyter", "matplotlib", "pandas", "ipykernel"]
dev = ["pytest>=7", "pytest-cov"]

[tool.hatch.build.targets.wheel]
packages = ["src/derivlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
